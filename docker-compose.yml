version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-broker
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=5432
      - DATABASE_NAME=productos
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=admin123
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_USER=default
      - REDIS_PASSWORD=123
      - OPENAI_API_KEY=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
      - OPENAI_BASE_URL=https://integrate.api.nvidia.com/v1
      - OPENAI_MODEL=deepseek-ai/deepseek-v4-flash
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: celery-worker
    command: celery -A celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=5432
      - DATABASE_NAME=productos
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=admin123
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_USER=default
      - REDIS_PASSWORD=123
      - OPENAI_API_KEY=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
      - OPENAI_BASE_URL=https://integrate.api.nvidia.com/v1
      - OPENAI_MODEL=deepseek-ai/deepseek-v4-flash
    depends_on:
      - redis
    restart: unless-stopped